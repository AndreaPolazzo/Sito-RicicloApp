<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicicloApp - Sito in sviluppo</title>
    <link rel="icon" type="image/png" href="icon.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #212529;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            border-radius: 22px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #212529;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://ricicloapp.andreapolazzo.dev/icon.png" alt="RicicloApp Logo" class="logo">
        <h1>Sito in sviluppo</h1>
    </div>

</body>
</html>
